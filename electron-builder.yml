##
## electron-builder — конфиг сборки CRM «Большая Медведица»
##
## Цели:
##   electron:pack      → --dir  (unpacked, для тестов и разработки)
##   electron:installer → --win nsis  (Setup.exe, draft installer)
##

appId: ru.teriberka.big-medveditsa-crm
productName: "Большая Медведица CRM"
copyright: "© 2025 Большая Медведица"
compression: store

# ── Директории ────────────────────────────────────────────────────────────────
directories:
  output: release
  buildResources: assets/app-icon

# ── Native modules ────────────────────────────────────────────────────────────
# npmRebuild: false — НЕ запускать electron-builder встроенный rebuild.
# Вместо него используем afterPack-хук (scripts/afterPack.cjs).
npmRebuild: false

# ── afterPack хук ─────────────────────────────────────────────────────────────
# Пересобирает better-sqlite3 под Electron ABI в output-директории.
# Работает для обоих таргетов: --dir и --win nsis.
afterPack: scripts/afterPack.cjs

# ── asar ─────────────────────────────────────────────────────────────────────
asar: false

# ── Файлы приложения ──────────────────────────────────────────────────────────
files:
  - dist/**/*
  - dist-server/**/*
  - dist-electron/**/*
  - assets/app-icon/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    - target: dir         # unpacked build (electron:pack)
      arch: [x64]
    - target: nsis        # Setup.exe installer (electron:installer)
      arch: [x64]
  icon: assets/app-icon/icon.ico
  executableName: "Bolshaya Medveditsa CRM"

# ── NSIS installer ────────────────────────────────────────────────────────────
nsis:
  oneClick: false
  perMachine: false
  # allowToChangeInstallationDirectory: true — вызывал зависание silent install
  # через инициализацию nsDialogs/LOCALAPPDATA в electron-builder NSIS template.
  # Установка всегда идёт в %LOCALAPPDATA%\Programs\bolshaya-medveditsa-crm\
  allowToChangeInstallationDirectory: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  useZip: true
  differentialPackage: false
  include: scripts/nsis-installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Большая Медведица CRM"
  artifactName: "Bolshaya-Medveditsa-CRM-Setup-${version}.${ext}"
